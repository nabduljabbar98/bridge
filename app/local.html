<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bridge</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="local.css" />
</head>
<body>
<div class="local-shell">
  <header class="local-top">
    <div class="local-brand">BRIDGE</div>
    <div class="local-top-right">
      <span class="local-pill" id="ableton-pill"><i class="dot"></i> Ableton Live</span>
      <button class="local-icon-btn" id="btn-settings" title="Settings">settings</button>
    </div>
  </header>

  <main class="local-main">
    <section class="local-panel">
      <div class="card">
        <label>prompt</label>
        <textarea id="prompt" rows="5" placeholder="describe the part you want..."></textarea>
        <div class="grid2">
          <div>
            <label>duration (seconds)</label>
            <input type="range" id="duration" min="3" max="300" value="30" />
            <span id="duration-val" class="hint">30s</span>
          </div>
          <div>
            <label>model</label>
            <select id="model">
              <option value="music_v1">music v1</option>
              <option value="music_v2">music v2</option>
              <option value="music_v2_5">music v2.5</option>
            </select>
          </div>
        </div>
        <label class="checkbox"><input type="checkbox" id="instrumental" /> instrumental only</label>
        <div class="actions">
          <button id="btn-generate" class="primary">generate</button>
        </div>
        <p class="status" id="gen-status"></p>
      </div>

      <div class="card" id="result-card" hidden>
        <h2>result</h2>
        <audio id="result-audio" controls></audio>
        <div class="grid2">
          <div>
            <label>track (-1 = new audio track)</label>
            <input type="number" id="track-index" min="-1" value="-1" />
          </div>
          <div>
            <label>clip slot</label>
            <input type="number" id="clip-index" min="0" value="0" />
          </div>
        </div>
        <div class="actions">
          <button id="btn-send-ableton" class="primary">send to ableton</button>
          <button id="btn-open-result">open file</button>
        </div>
        <p class="status" id="send-status"></p>
      </div>
    </section>

    <aside class="local-side">
      <div class="card">
        <h2>api keys</h2>
        <label>elevenlabs api key</label>
        <input type="password" id="api-key" placeholder="xi-api-key..." />
        <p class="hint">stored locally on this machine. never sent anywhere except elevenlabs.</p>
        <div class="actions">
          <button id="btn-save-key" class="primary">save</button>
        </div>
        <p class="status" id="key-status"></p>
      </div>
      <div class="card">
        <h2>ableton</h2>
        <div class="row"><span>live</span><span id="ableton-status" class="badge">checking</span></div>
        <div class="row"><span>osc</span><span id="osc-status" class="badge">checking</span></div>
        <p class="hint" id="scripts-dir"></p>
        <div class="actions">
          <button id="btn-refresh">refresh</button>
          <button id="btn-install">install script</button>
        </div>
      </div>
    </aside>
  </main>
</div>
<script src="local.js"></script>
</body>
</html>
